<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Epistrel Console{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 60rem; }
    .state-healthy { color: #1a7f37; }
    .state-unhealthy { color: #9a6700; }
    .state-unreachable { color: #cf222e; }
    dt { font-weight: 600; }
    footer { margin-top: 2rem; color: #666; font-size: 0.9em; }
  </style>
</head>
<body>
  <header>{% block header %}<h1>Epistrel Console</h1>{% endblock %}</header>
  <main>{% block content %}{% endblock %}</main>
  <footer>{% block footer %}Epistrel Console {{ version }}{% endblock %}</footer>
</body>
</html>
