{# The story header's configuration block (#85; console.story_config.ConfigBadge). Context: config_badge, oob (after a turn). #}<span id="story-config"{% if oob %} hx-swap-oob="true"{% endif %}>{% if config_badge.unavailable %}<a class="config-link config-unavailable" href="{{ config_badge.url }}">config unavailable</a>{% else %}<a class="config-link" href="{{ config_badge.url }}"><code class="fingerprint" title="{{ config_badge.fingerprint }}">{{ config_badge.short }}</code> <span class="quality {{ config_badge.quality_class }}">{{ config_badge.quality|default:"—" }}</span></a>{% endif %}</span>
