{# One beat of the Renders section (#201). Context: b (console.renders.RenderBeat). A reaction reads "↳ <reactor> (reaction): …", an Other or player-narrated beat "<label>: …"; its reactions (one level) nest in an <ol class="reactions">. #}{% load console_format erasure %}<li{% if b.anchor %} id="{{ b.anchor }}"{% endif %}{% if b.css_class %} class="{{ b.css_class }}"{% endif %}>{% if b.reaction %}↳ {{ b.label }} (reaction): {% elif b.label %}{{ b.label }}: {% endif %}{% if b.item.beat is not None %}beat {{ b.item.beat }}{% else %}item {{ b.position }}{% endif %} · {{ b.item.channel|humanised }}{% if b.fidelity %} <span class="badge-fidelity" title="{{ b.fidelity.title }}">{{ b.fidelity.text }}</span>{% endif %} · <span class="text">{{ b.item.text|mark_erased }}</span>{% if b.reactions %}<ol class="reactions">{% for r in b.reactions %}{% include "console/play/_render_beat.html" with b=r %}{% endfor %}</ol>{% endif %}</li>
