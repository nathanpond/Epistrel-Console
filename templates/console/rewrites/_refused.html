<h4>{{ view.preview.refused_heading }} ({{ view.preview.refused|length }})</h4>
{% if view.preview.refused %}<table class="refused">
  <thead><tr><th>Reason</th><th>Change</th><th></th></tr></thead>
  <tbody>{% for row in view.preview.refused %}
    <tr><td>{{ row.kind_text }}</td><td>{{ row.summary }}</td><td class="more"><details><summary>More</summary><pre>{{ row.more }}</pre></details></td></tr>{% endfor %}
  </tbody>
</table>{% else %}<p>None</p>{% endif %}
