{% load console_format %}{% url 'media:content' image.media_id as raw_url %}
<figure class="catalog-image" id="image-{{ image.media_id }}">
  <a href="{{ raw_url }}">{% if image.is_video %}<video controls preload="metadata" width="160" src="{{ raw_url }}"></video>{% else %}<img src="{{ raw_url }}?img=1" width="160" alt="{{ image.alt_text|default_if_none:'' }}">{% endif %}</a>
  <figcaption>
    <dl>
      <dt>Slot</dt><dd>{{ image.slot }}</dd>
      {% if audience %}<dt>Audience</dt><dd>{{ image.audience|humanise }}{% if image.restricted %} <strong class="restricted">restricted</strong>{% endif %}</dd>{% endif %}
      <dt>Media id</dt><dd><code>{{ image.media_id }}</code></dd>
      <dt>Alt text</dt><dd>{{ image.alt_text|default_if_none:"—" }}</dd>
      {% if image.detail %}
      <dt>Caption</dt><dd>{{ image.detail.caption|default_if_none:"—" }}</dd>
      <dt>MIME type</dt><dd>{{ image.detail.mime_type|default_if_none:"—" }}</dd>
      <dt>Dimensions</dt><dd>{% if image.detail.width is not None and image.detail.height is not None %}{{ image.detail.width }}×{{ image.detail.height }}{% else %}—{% endif %}</dd>
      {% endif %}
    </dl>
    {% if image.detail.generation_metadata %}<details><summary>Generation metadata</summary><pre>{{ image.detail.generation_metadata|pretty_json }}</pre></details>{% endif %}
  </figcaption>
</figure>
