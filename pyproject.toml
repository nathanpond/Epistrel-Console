[project]
name = "epistrel-console"
version = "0.1.0"
description = "Human-facing test harness for the Epistrel Engine"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=5.2",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "DJ", "PT"]

[tool.ruff.lint.per-file-ignores]
# S101: pytest's plain `assert` is the assertion mechanism in tests.
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["epistrel_console", "tests", "manage.py"]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "epistrel_console.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "epistrel_console.settings"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
