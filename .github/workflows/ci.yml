# The merge gate. Runs on every pull request and is reused (workflow_call) by the publish and
# release workflows, so what guards a merge is exactly what guards a release. Mirrors the Engine's
# ci.yml (nathanpond/Epistrel), minus its milestone-gate steps, coverage and Postgres tests.
name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out (callers pin a SHA; PR runs use the default merge ref)
        type: string
        required: false
        default: ""
      live_smoke:
        description: Run engine-smoke (edge publishing and edge rollback pass false, #37)
        type: boolean
        required: false
        default: true
      engine_image:
        description: The Engine image engine-smoke starts (releases pass the matching version, #38)
        type: string
        required: false
        default: ghcr.io/nathanpond/epistrel:edge
    outputs:
      engine_digest:
        description: The Engine image digest the smoke ran against (empty when skipped)
        value: ${{ jobs.engine-smoke.outputs.engine_digest }}
      engine_version:
        description: The live Engine's /openapi.json info.version (empty when skipped)
        value: ${{ jobs.engine-smoke.outputs.engine_version }}

permissions:
  contents: read

# PR runs cancel superseded builds; a caller's release gate is never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # On a PR `inputs` is empty, and GitHub compares null == false as true, so "live smoke on" is
  # spelled as "a PR, or a caller that asked for it" (never `inputs.live_smoke != false`).
  LIVE_SMOKE: ${{ (github.event_name == 'pull_request' || inputs.live_smoke) && 'true' || 'false' }}
  # Exact uv release, resolved 2026-10-24; equal to the Dockerfile's pin (tests/test_workflows.py).
  UV_VERSION: "0.13.5"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2  # exact: setup-uv publishes no floating major tag
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --frozen
      # Each check after the sync runs even if an earlier one failed, so every failure is reported.
      - run: uv run ruff check --output-format=github .
        if: always()
      - run: uv run ruff format --check .
        if: always()

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2  # exact: setup-uv publishes no floating major tag
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen
      # Strict mode comes from pyproject's [tool.mypy] strict = true (tests/test_repo_config.py).
      - run: uv run mypy

  test:
    # CONSOLE_ENGINE_URL stays unset here: tests and tooling must not need an Engine.
    runs-on: ubuntu-latest
    timeout-minutes: 25  # the suite alone takes ~13-14 min on a hosted runner
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2  # exact: setup-uv publishes no floating major tag
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest
      - run: uv run python manage.py check
        if: always()
      - run: uv run python manage.py makemigrations --check --dry-run
        if: always()

  docker:
    # M0's image and compose tests (#31, #32). They build the image themselves with the runner's
    # default Docker, so this job is also the Docker build check. No setup-buildx: its container
    # driver would keep the image out of the local store those tests use. With
    # REQUIRE_DOCKER_TESTS=1 a docker test that would skip (no daemon, pull failed) fails instead.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2  # exact: setup-uv publishes no floating major tag
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen
      # Without the live smoke (#37: edge publish and rollback), tests that need the live Engine
      # edge (marker engine_edge, #32's compose run) are left out, so an Engine outage cannot stop
      # the Console's edge from publishing. PRs and releases run all of them.
      - name: pytest -m docker
        env:
          REQUIRE_DOCKER_TESTS: "1"
          MARKERS: ${{ env.LIVE_SMOKE == 'true' && 'docker' || 'docker and not engine_edge' }}
        run: uv run pytest -m "$MARKERS"

  engine-smoke:
    # The Console against the live Engine (#36): a broken or unpublished Engine edge blocks merges.
    if: ${{ github.event_name == 'pull_request' || inputs.live_smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: epistrel
          POSTGRES_PASSWORD: epistrel-dev  # the Engine compose's dev-only value, as docker-compose.yml
          POSTGRES_DB: epistrel
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENGINE_IMAGE: ${{ inputs.engine_image || 'ghcr.io/nathanpond/epistrel:edge' }}
      ENGINE_LIVE_URL: http://127.0.0.1:8000
    outputs:
      engine_digest: ${{ steps.identify.outputs.engine_digest }}
      engine_version: ${{ steps.identify.outputs.engine_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2  # exact: setup-uv publishes no floating major tag
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen
      # A step after the health-checked Postgres service, not a service itself (see the script).
      - name: start the Engine
        env:
          NETWORK: ${{ job.services.postgres.network }}
        run: .github/scripts/engine-up.sh start
      - id: wait
        run: .github/scripts/engine-up.sh wait
      - id: identify
        run: .github/scripts/engine-up.sh identify
      - run: uv run pytest -m engine_live
      - name: summary
        if: always()
        env:
          ENGINE_DIGEST: ${{ steps.identify.outputs.engine_digest }}
          ENGINE_VERSION: ${{ steps.identify.outputs.engine_version }}
        run: .github/scripts/engine-up.sh summary
      - name: logs
        if: failure()
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: .github/scripts/engine-up.sh logs

  engine-release-smoke:
    # engine-smoke against the newest Engine *release*, not edge (#124): released Engines know fewer
    # settings than edge, and a release's smoke starts one, so engine-up.sh must keep working there.
    if: ${{ github.event_name == 'pull_request' || inputs.live_smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: epistrel
          POSTGRES_PASSWORD: epistrel-dev  # the Engine compose's dev-only value, as docker-compose.yml
          POSTGRES_DB: epistrel
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENGINE_LIVE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2  # exact: setup-uv publishes no floating major tag
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen
      # The Engine's latest (highest stable) GitHub release; its image tag drops the `v`.
      - name: newest Engine release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo nathanpond/Epistrel --json tagName --jq .tagName)
          [ -n "$tag" ] || { echo "::error::nathanpond/Epistrel has no release"; exit 1; }
          echo "ENGINE_IMAGE=ghcr.io/nathanpond/epistrel:${tag#v}" >> "$GITHUB_ENV"
      - name: start the Engine
        env:
          NETWORK: ${{ job.services.postgres.network }}
        run: .github/scripts/engine-up.sh start
      - run: .github/scripts/engine-up.sh wait
      - id: identify
        run: .github/scripts/engine-up.sh identify
      # engine_auth needs service auth and the M2 routes (Engine #44); release 0.1.1 has neither.
      - run: uv run pytest -m "engine_live and not engine_auth"
      - name: summary
        if: always()
        env:
          ENGINE_DIGEST: ${{ steps.identify.outputs.engine_digest }}
          ENGINE_VERSION: ${{ steps.identify.outputs.engine_version }}
        run: .github/scripts/engine-up.sh summary
      - name: logs
        if: failure()
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: .github/scripts/engine-up.sh logs

  gate:
    # One context for the ruleset to require: red unless every job above succeeded (the two Engine
    # smokes may be skipped only when the caller turned the live smoke off).
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [lint, types, test, docker, engine-smoke, engine-release-smoke]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - name: Summarise
        env:
          LINT: ${{ needs.lint.result }}
          TYPES: ${{ needs.types.result }}
          TEST: ${{ needs.test.result }}
          DOCKER: ${{ needs.docker.result }}
          ENGINE_SMOKE: ${{ needs.engine-smoke.result }}
          ENGINE_RELEASE_SMOKE: ${{ needs.engine-release-smoke.result }}
        run: .github/scripts/gate.sh
