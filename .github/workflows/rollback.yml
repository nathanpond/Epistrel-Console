# Production rollback without a rebuild: re-point `latest` (and the floating tags that resolve to the
# bad digest) at a known-good version's image and demote the bad GitHub release to a pre-release.
# Ported from the Engine's rollback.yml. See RELEASING.md → Production rollback.
name: Rollback

on:
  workflow_dispatch:
    inputs:
      good_version:
        description: Version to make latest again, bare X.Y.Z (e.g. 0.1.0)
        type: string
        required: true
      bad_version:
        description: Optional bad version to demote, bare X.Y.Z (e.g. 0.1.1)
        type: string
        required: false
        default: ""

permissions:
  contents: read

# Shared with release.yml's publish job: a release and a rollback never move `latest` at once.
concurrency:
  group: release-latest
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/nathanpond/epistrel-console

jobs:
  rollback:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Every check runs before anything changes: no tag or release is touched unless all pass.
      - name: Pre-checks (nothing is changed before all of these pass)
        id: pre
        env:
          GH_TOKEN: ${{ github.token }}
          GOOD: ${{ inputs.good_version }}
          BAD: ${{ inputs.bad_version }}
        run: |
          set -eu
          # [[ =~ ]] matches the whole value; grep would accept one good line of a multi-line input.
          re='^[0-9]+\.[0-9]+\.[0-9]+$'
          [[ $GOOD =~ $re ]] || { echo "::error::good_version must be bare X.Y.Z (no v, no pre-release) — nothing changed"; exit 1; }
          if [ -n "$BAD" ]; then
            [[ $BAD =~ $re ]] || { echo "::error::bad_version must be bare X.Y.Z — nothing changed"; exit 1; }
            [ "$GOOD" != "$BAD" ] || { echo "::error::good_version and bad_version are the same — nothing changed"; exit 1; }
          fi
          running=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --limit 50 --json status \
            --jq '[.[] | select(.status | test("^(in_progress|queued|waiting|pending|requested)$"))] | length')
          [ "$running" = "0" ] || { echo "::error::a release run is not finished yet ($running); retry when it is — nothing changed"; exit 1; }
          # The registry's own message is kept: a missing tag and an auth or network failure differ.
          good_digest=$(docker buildx imagetools inspect "$IMAGE:$GOOD" --format '{{.Manifest.Digest}}' 2>inspect.err) \
            || { echo "::error::cannot inspect $IMAGE:$GOOD (image tag not found, or the registry refused): $(tr '\n' ' ' < inspect.err)— nothing changed"; exit 1; }
          gh release view "v$GOOD" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null \
            || { echo "::error::release v$GOOD does not exist — nothing changed"; exit 1; }
          bad_digest=""
          if [ -n "$BAD" ]; then
            gh release view "v$BAD" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null \
              || { echo "::error::release v$BAD does not exist — nothing changed"; exit 1; }
            # A bad version with no image has nothing floating on it. Any other failure (auth,
            # network) stops here: a blank digest would leave X.Y/X on the bad image unnoticed.
            if bad_digest=$(docker buildx imagetools inspect "$IMAGE:$BAD" --format '{{.Manifest.Digest}}' 2>inspect.err); then :
            elif grep -Eqi 'not found|manifest unknown' inspect.err; then bad_digest=""
            else echo "::error::cannot inspect $IMAGE:$BAD (the registry refused): $(tr '\n' ' ' < inspect.err)— nothing changed"; exit 1
            fi
          fi
          echo "good_digest=$good_digest" >> "$GITHUB_OUTPUT"
          echo "bad_digest=$bad_digest" >> "$GITHUB_OUTPUT"
      - name: Re-point floating tags
        id: retag
        env:
          GOOD: ${{ inputs.good_version }}
          BAD: ${{ inputs.bad_version }}
          GOOD_DIGEST: ${{ steps.pre.outputs.good_digest }}
          BAD_DIGEST: ${{ steps.pre.outputs.bad_digest }}
        run: |
          set -eu
          major=${GOOD%%.*}; rest=${GOOD#*.}; minor=${rest%%.*}
          tags=(latest "$major.$minor" "$major"); befores=()
          # Every tag is read before any moves: only a missing tag reads as "(none)"; any other
          # inspect failure stops the run with nothing re-pointed.
          for tag in "${tags[@]}"; do
            if before=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{.Manifest.Digest}}' 2>inspect.err); then :
            elif grep -Eqi 'not found|manifest unknown' inspect.err; then before="(none)"
            else echo "::error::cannot inspect $IMAGE:$tag (the registry refused): $(tr '\n' ' ' < inspect.err)— nothing re-pointed"; exit 1
            fi
            befores+=("$before")
          done
          moved=""; report=""
          for i in 0 1 2; do
            tag=${tags[$i]}; before=${befores[$i]}
            move=no
            if [ "$tag" = "latest" ]; then move=yes
            elif [ -n "$BAD" ] && [ -n "$BAD_DIGEST" ] && [ "$before" = "$BAD_DIGEST" ]; then
              # Only when good belongs to that line (a bad 1.3.0 with good 1.2.5 leaves `1.3` alone).
              case "$BAD" in "$major.$minor."*) move=yes ;; "$major."*) [ "$tag" = "$major" ] && move=yes ;; esac
            fi
            if [ "$move" = yes ]; then
              docker buildx imagetools create -t "$IMAGE:$tag" "$IMAGE@$GOOD_DIGEST"
              moved="$moved $tag"
              report="$report| \`$tag\` | \`$before\` | \`$GOOD_DIGEST\` |\n"
            else
              report="$report| \`$tag\` | \`$before\` | unchanged |\n"
            fi
          done
          echo "moved=$moved" >> "$GITHUB_OUTPUT"
          printf '## Image tags\n\n| tag | before | after |\n|---|---|---|\n%b' "$report" >> "$GITHUB_STEP_SUMMARY"
      - name: Promote the good release, demote the bad one
        env:
          GH_TOKEN: ${{ github.token }}
          GOOD: ${{ inputs.good_version }}
          BAD: ${{ inputs.bad_version }}
        run: |
          set -eu
          gh release edit "v$GOOD" --repo "$GITHUB_REPOSITORY" --latest --prerelease=false
          echo "- v$GOOD marked latest" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$BAD" ]; then
            gh release view "v$BAD" --repo "$GITHUB_REPOSITORY" --json body --jq .body > bad-notes.md
            # A re-run replaces the earlier note, so it always names the current good version.
            python3 -m tools.release.notes --rollback-note "Rolled back on $(date -u +%Y-%m-%d); use v$GOOD." bad-notes.md > bad-body.md
            gh release edit "v$BAD" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false --notes-file bad-body.md
            echo "- v$BAD demoted to pre-release" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Post-condition
        env:
          GOOD_DIGEST: ${{ steps.pre.outputs.good_digest }}
          MOVED: ${{ steps.retag.outputs.moved }}
        run: |
          set -eu
          for tag in $MOVED; do
            now=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{.Manifest.Digest}}')
            [ "$now" = "$GOOD_DIGEST" ] || { echo "::error::$IMAGE:$tag resolves to $now, expected $GOOD_DIGEST"; exit 1; }
          done
          echo "- every re-pointed tag resolves to $GOOD_DIGEST" >> "$GITHUB_STEP_SUMMARY"
